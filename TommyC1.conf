[URL Rewrite]
# ============ 轻量去广告 URL 重写 ============
# --- 通用广告 SDK ---
^https?:\/\/.*\.doubleclick\.net - reject
^https?:\/\/.*\.googlesyndication\.com\/pagead - reject

# --- 国内 App 开屏广告 ---
^https?:\/\/[\w-]+\.snssdk\.com\/api\/ad - reject
^https?:\/\/is\.snssdk\.com\/api\/ad - reject
^https?:\/\/[\w-]+\.amemv\.com\/api\/ad - reject

# --- 百度搜索广告 ---
^https?:\/\/m\.baidu\.com\/static\/search\/raft - reject

# --- 微博广告 ---
^https?:\/\/sdkapp\.uve\.weibo\.com\/interface\/sdk - reject

# --- Google 搜索重定向（可选，取消注释启用）---
# ^https?:\/\/(www\.)?g(oogle)?\.cn https://www.google.com 302


[MITM]
# MITM 用于 HTTPS 去广告
# ⚠️ 首次使用需要在 Shadowrocket 中安装并信任证书
# 设置 → HTTPS 解密 → 生成新的 CA 证书 → 安装 → 信任
enable = false
h2 = true
hostname = *.doubleclick.net, *.googlesyndication.com, *.snssdk.com, *.amemv.com, m.baidu.com, sdkapp.uve.weibo.com
